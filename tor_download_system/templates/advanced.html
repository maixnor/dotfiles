
                        <div class="card">
                            <div class="section-title">Advanced Statistics (Last 6 Hours)</div>
                            
                            <div class="grid-stats">
                                <div class="stat-card">
                                    <div class="stat-label">Speed Stats (bps)</div>
                                    <div class="stat-sub">Min: SPEED_MIN</div>
                                    <div class="stat-sub">Max: SPEED_MAX</div>
                                    <div class="stat-sub">Avg: SPEED_AVG</div>
                                    <div class="stat-sub">Median: SPEED_MEDIAN</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-label">File Size Stats (bytes)</div>
                                    <div class="stat-sub">Min: SIZE_MIN</div>
                                    <div class="stat-sub">Max: SIZE_MAX</div>
                                    <div class="stat-sub">Avg: SIZE_AVG</div>
                                    <div class="stat-sub">Median: SIZE_MEDIAN</div>
                                </div>
                            </div>
                            
                            <div style="margin-top: 20px;">
                                <canvas id="chartRequests"></canvas>
                            </div>
                            <div style="margin-top: 20px;">
                                <canvas id="chartCodes"></canvas>
                            </div>
                            <div style="margin-top: 20px;">
                                <canvas id="chartSpeed"></canvas>
                            </div>

                            <script>
                                const tData = TIMELINE_DATA;
                                const labels = tData.map(d => d.minute.split(" ")[1]);
                                
                                new Chart(document.getElementById('chartRequests'), {
                                    type: 'line',
                                    data: {
                                        labels: labels,
                                        datasets: [{
                                            label: 'Requests / 5min',
                                            data: tData.map(d => d.requests),
                                            borderColor: '#3b82f6',
                                            tension: 0.1
                                        }]
                                    },
                                    options: { responsive: true, plugins: { title: { display: true, text: 'Requests per 5 Minutes', color: '#fff' } } }
                                });

                                const totals = tData.map(d => d.requests > 0 ? d.requests : 1);
                                const pct200 = tData.map((d, i) => (d.rc_200 / totals[i]) * 100);
                                const pct429 = tData.map((d, i) => (d.rc_429 / totals[i]) * 100);
                                const pct500 = tData.map((d, i) => (d.rc_500 / totals[i]) * 100);
                                const pctOther = tData.map((d, i) => (d.rc_other / totals[i]) * 100);

                                new Chart(document.getElementById('chartCodes'), {
                                    type: 'line',
                                    data: {
                                        labels: labels,
                                        datasets: [
                                            { label: '200 OK', data: pct200, borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.2)', fill: true },
                                            { label: '429 Throttled', data: pct429, borderColor: '#f59e0b', backgroundColor: 'rgba(245, 158, 11, 0.2)', fill: true },
                                            { label: '500 Error', data: pct500, borderColor: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.2)', fill: true },
                                            { label: 'Other', data: pctOther, borderColor: '#9ca3af', backgroundColor: 'rgba(156, 163, 175, 0.2)', fill: true }
                                        ]
                                    },
                                    options: { responsive: true, scales: { x: { stacked: true }, y: { stacked: true, max: 100, ticks: { callback: function(val) { return val + '%'; } } } }, plugins: { title: { display: true, text: 'Return Codes % (100% Stacked)', color: '#fff' } } }
                                });

                                const avgSpeed = tData.reduce((acc, d) => acc + (d.sum_speed_bps || 0), 0) / (tData.length || 1);

                                new Chart(document.getElementById('chartSpeed'), {
                                    type: 'line',
                                    data: {
                                        labels: labels,
                                        datasets: [
                                            {
                                                label: 'Speed (bps)',
                                                data: tData.map(d => d.sum_speed_bps),
                                                borderColor: '#a78bfa',
                                                tension: 0.1
                                            },
                                            {
                                                label: 'Average',
                                                data: Array(tData.length).fill(avgSpeed),
                                                borderColor: 'rgba(255, 255, 255, 0.5)',
                                                borderDash: [5, 5],
                                                borderWidth: 1,
                                                pointRadius: 0,
                                                tension: 0
                                            }
                                        ]
                                    },
                                    options: { responsive: true, plugins: { title: { display: true, text: 'Download Speed over last 6h (5m intervals)', color: '#fff' } } }
                                });
                            </script>
                        </div>
